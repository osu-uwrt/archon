# Copy to archon.toml in the project you're testing (archon looks in the current directory and above),
# or pass a path: archon path/to/bench.toml

# Run on a ROS network of the bench's own (as --isolated does), or over zenoh (as --zenoh does)
# isolated = true
# zenoh = true

# Environment for every process
env = { RMW_IMPLEMENTATION = "rmw_fastrtps_cpp" }

[[process]]
name = "agent"
cmd = "ros2 run micro_ros_agent micro_ros_agent serial --dev /dev/serial/by-id/usb-..."
autostart = true
restart = "on-failure"      # never (default) | on-failure | always
# cwd = "relative/to/this/file"
# env = { ROS_DOMAIN_ID = "7" }

[[serial]]
name = "debug"
# by-id paths survive the board re-enumerating after a flash
port = "/dev/serial/by-id/usb-..."
baud = 115200
# autostart = true          # the default for serial ports
# line_ending = "lf"        # lf (default) | crlf | cr | none, appended to what you send

# Topic echoes, opened with the profile; they wait for the topic to appear
[[echo]]
topic = "/rosout"
name = "logs"

# Rates for the health strip
[[watch]]
topic = "/imu/data"
min_hz = 100

# A message to publish, sent from the sidebar, the palette, or its key. With a rate, the key starts and stops
# sending at that rate instead of sending once.
[[publish]]
name = "kill"
topic = "/talos/state/kill"
type = "std_msgs/msg/Bool"
value = { data = true }
rate = 10
key = "F2"

# A CAN bus, shown like candump; type id#data into it (i) to send a frame
# [[can]]
# name = "bus"
# interface = "can0"

# A pattern to watch every source's output for: its chip in the health strip counts it, pause keeps the moment on
