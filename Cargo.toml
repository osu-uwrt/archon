[workspace]
resolver = "3"
members = ["crates/core", "crates/sources", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
archon-core = { path = "crates/core" }
archon-sources = { path = "crates/sources" }

serde = { version = "1", features = ["derive"] }
toml = "0.9"
anyhow = "1"
eframe = "0.37"
egui = "0.37"
portable-pty = "0.9"
serialport = { version = "4.10", default-features = false }
nucleo-matcher = "0.3"
libc = "0.2"
dirs = "6"
